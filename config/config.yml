app:
  name: admin-api
  port: 9501
  debug: false
  idle_timeout: 60
  prefork: false
  # 安全基线：Swagger UI 无需认证即可访问完整 API 文档（/docs），生产环境必须保持关闭；
  # 仅在隔离的本地开发环境临时开启
  swagger: false
  # JWT 用户端密钥：留空时启动会自动生成随机密钥；生产环境必须通过环境变量 CMF_APP_SECRET 设置强密钥
  secret: ""
  login_expires: 86400
  # JWT 管理端密钥：留空时启动会自动生成随机密钥；生产环境必须通过环境变量 CMF_APP_ADMIN_SECRET 设置强密钥
  admin_secret: ""
  admin_login_expires: 7200
  admin_refresh_expires: 86400
  body_limit: 10485760

log:
  file_path: ./data/logs/admin-api.log
  console_output: true
  file_output: true
  max_size: 10
  max_backups: 10
  max_age: 180
  # 操作日志/登录日志保留天数（cleanup_expired_logs 任务使用），默认 30；负数表示不自动清理
  retention_days: 30

database:
  default: default
  connections:
    default:
      driver: mysql
      host: localhost
      port: 3306
      user: root
      # 数据库密码：生产环境请勿在此处硬编码，应通过环境变量 CMF_DATABASE_CONNECTIONS_DEFAULT_PASSWORD 设置
      password: "root"
      name: go_admin
      ssl_mode: false
      table_prefix: admin_

cache:
  default: memory
  stores:
    memory:
      driver: memory
      default_ttl: 3600
    redis:
      driver: redis
      default_ttl: 3600

redis:
  default: redis
  connections:
    redis:
      addr: localhost:6379
      username: ""
      password: ""
      db: 0
      dial_timeout: 5
      read_timeout: 3
      write_timeout: 3
      pool_size: 10
      min_idle_conns: 5
      max_idle_conns: 10
      conn_max_idle_time: 30
      conn_max_lifetime: 24
      use_tls: false
    queue_redis:
      # 任务队列专用连接：队列实际只读取 addr/username/password/db/pool_size，
      # 其余超时/空闲参数仅对缓存等 Redis 客户端生效
      addr: localhost:6379
      username: ""
      password: ""
      db: 1
      pool_size: 10

captcha:
  store: memory
  redis_connection: redis
  key_prefix: captcha

plugin:
  # 生产环境必须启用，并通过 CMF_PLUGIN_TRUSTED_PUBLIC_KEYS 配置一个或多个逗号分隔的 Base64 Ed25519 公钥。
  # 签名文件与插件包同目录，命名为 <package>.zip.sig，内容为对 ZIP SHA-256 摘要签名后的 Base64。
  require_signature: false
  trusted_public_keys: ""

filesystem:
  default: local
  is_and_local: false
  disks:
    local:
      driver: local
      options:
        root: ./data/storage
    s3:
      driver: s3
      options:
        access_key: ""
        secret_key: ""
        region: ""
        bucket: ""
        endpoint: ""

casbin:
  # 默认域名称，GetDefaultEnforcer() 将返回此域的 Enforcer
  domains_default: 'default'
  
  # 多域配置列表（可选）
  # 如果不配置此项，系统会使用上面的 model_path 为默认域创建配置
  domains:
    # 默认域配置
    - name: "default"
      auto_load: true                          # 是否在启动时自动加载
      model_text: |                            # 带域的 RBAC 模型配置
        [request_definition]
        r = sub, dom, obj, act
        
        [policy_definition]
        p = sub, dom, obj, act
        
        [role_definition]
        g = _, _, _
        
        [policy_effect]
        e = some(where (p.eft == allow))
        
        [matchers]
        m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
    
    # ==================== 多域配置示例 ====================
    # 可以为不同的租户或业务域配置独立的权限模型
    
    # 示例：租户 A 的配置
    # - name: "tenant-a"
    #   auto_load: true
    #   model_path: "./config/tenant_a_model.conf"
    
    # 示例：租户 B 的配置（使用内联模型文本）
    # - name: "tenant-b"
    #   auto_load: false  # 不自动加载，首次使用时才加载
    #   model_text: |
    #     [request_definition]
    #     r = sub, obj, act
    #     
    #     [policy_definition]
    #     p = sub, obj, act
    #     
    #     [role_definition]
    #     g = _, _
    #     
    #     [policy_effect]
    #     e = some(where (p.eft == allow))
    #     
    #     [matchers]
    #     m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
    
    # 示例：特殊业务域配置
    # - name: "special-domain"
    #   auto_load: true
    #   model_path: "./config/special_model.conf"
  
  # ==================== 配置说明 ====================
  # 1. domains_default: 指定默认域名称
  # 2. domains: 域配置列表，每个域包含：
  #    - name: 域名称（必填，唯一标识）
  #    - auto_load: 是否启动时自动加载（可选，默认 false）
  #    - model_path: 模型文件路径（可选）
  #    - model_text: 模型文本内容（可选，优先级高于 model_path）
  # 3. 如果不配置 domains，系统会使用 model_path 为默认域创建配置
  # 4. 建议高频访问的域设置 auto_load: true 以提升性能
attachment:
  x_accel_enabled: false  # 是否启用 X-Accel-Redirect 头 生产环境启用并配置

# ==================== 消息通知多渠道配置 ====================
# 站内信（SSE 实时推送）无需配置，始终启用；
# 以下外部渠道均为「未配置即自动禁用」，不影响主流程与消息落库。
# 密钥类字段建议通过环境变量注入，例如 CMF_NOTIFY_SMS_ACCESS_KEY。
notify:
  sms:
    enabled: false            # 是否启用短信渠道
    provider: ""              # 服务商标识：aliyun | tencent | 自建网关标识
    endpoint: ""              # 短信网关 HTTP 接口（项目以内部网关适配各厂商 SDK）
    access_key: ""            # 网关 AccessKey
    secret_key: ""            # 网关 SecretKey
    sign_name: ""             # 短信签名，如「XX科技」
    template_code: ""         # 短信模板编号（走模板短信时必填）
    timeout: 10               # 单次请求超时（秒）
  mail:
    enabled: false            # 是否启用邮件渠道
    endpoint: ""              # 邮件网关 HTTP 接口
    token: ""                 # 网关 Bearer Token
    from: ""                  # 发件人地址
    timeout: 10               # 单次请求超时（秒）
  push:
    enabled: false            # 是否启用极光推送渠道
    app_key: ""               # 极光 AppKey
    master_secret: ""         # 极光 Master Secret
    host: "https://api.jpush.cn"  # 极光 REST API 地址（海外可改为对应区域）
    timeout: 10               # 单次请求超时（秒）
    production: true          # APNs 是否生产环境；开发/沙箱调试 iOS 推送时设为 false

queue:
  driver: asynq             # asynq | rabbitmq | nats | nsq | kafka | amqp10
  namespace: admin          # broker 资源前缀；切换驱动前先排空旧 broker
  # 非 asynq 驱动须将 max_retry、retention、max_queue_size 设为 0；延时/去重等入队选项不支持。
  # rabbitmq: {url: "amqp://guest:guest@localhost:5672/", management_url: "http://localhost:15672"}
  # nats: {url: "nats://localhost:4222"}
  # nsq: {nsqd: "127.0.0.1:4150", lookupd: "127.0.0.1:4161", http: "http://127.0.0.1:4151"}
  # kafka: {brokers: ["127.0.0.1:9092"], group: "admin-tasks", partitions: 3, replication_factor: 1}
  # amqp10: {url: "amqp://127.0.0.1:5672"}
  # 任务队列（asynq/Redis）：Redis 连接复用 redis.connections 中的命名连接。
  # 生产环境要求 Redis >= 6.2（归档/死信能力依赖 ZRANGE ... BYSCORE）。
  redis_connection: queue_redis
  concurrency: 10            # 并发 worker 数
  queues:                    # 消费的队列及优先级权重
    default: 10
  strict_priority: false     # 严格优先级模式
  max_retry: 3               # 默认最大重试次数（超限进入死信）
  timeout: 600               # 单任务默认处理超时（秒）
  retention: 3600            # 成功任务保留时长（秒），供管理端查看历史
  max_queue_size: 10000      # 每队列存量任务准入阈值（含成功/死信历史），多进程为软阈值
  max_payload_bytes: 65536   # 单任务载荷字节上限（投递端和执行端）
  # 监控页（asynqmon，只读）挂载在管理端认证之后；生产环境建议保持关闭
  enable_monitor: false
  monitor_path: /api/v1/admin/auth/queue-monitor
