# 本地开发用 MinIO：go run main.go 前执行
#   docker compose -f docker-compose.minio.yml up -d
#
# 控制台 http://127.0.0.1:9001（minioadmin / minioadmin）
# API     http://127.0.0.1:9000
# 桶      admin-attachments（public/ 前缀匿名可读，其余走预签名 URL）
#
# 生产环境请勿使用默认账号，并通过环境变量注入 config.yml：
#   CMF_FILESYSTEM_DISKS_S3_OPTIONS_ACCESS_KEY
#   CMF_FILESYSTEM_DISKS_S3_OPTIONS_SECRET_KEY
name: go-admin-minio

services:
  minio:
    # alpine/minio 无 latest 标签；latest-release 指向社区 Alpine 构建。
    # 容器以 uid 100 运行；若沿用旧镜像创建的卷（root 属主），先执行：
    # docker run --rm -u 0 -v go-admin-minio_minio_data:/data \
    #   --entrypoint /bin/sh alpine/minio:latest-release -c 'chown -R 100:101 /data'
    image: alpine/minio:latest-release
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # 一次性初始化：建桶 + 只放开 public/ 前缀的匿名读。
  # alpine/minio 不自带 mc，这里沿用包含 mc 的镜像。
  minio-init:
    image: pgsty/minio:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb --ignore-existing local/admin-attachments
        cat > /tmp/public-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::admin-attachments/public/*"]
            }
          ]
        }
        EOF
        mc anonymous set-json /tmp/public-policy.json local/admin-attachments
        echo "MinIO bucket admin-attachments ready"

volumes:
  minio_data:
