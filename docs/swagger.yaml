basePath: /api/v1
definitions:
  cron.LogFileInfo:
    properties:
      created_at:
        type: string
      filename:
        type: string
      size:
        type: integer
    type: object
  handler.AssignPermissionsRequest:
    properties:
      domain:
        type: string
      permissions:
        items:
          $ref: '#/definitions/service.PermissionRule'
        minItems: 1
        type: array
      role_name:
        type: string
    required:
    - domain
    - permissions
    - role_name
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.GetPublicKeyResponse:
    properties:
      algorithm:
        description: 加密算法
        type: string
      created_at:
        description: 密钥创建时间
        type: string
      expires_at:
        description: 密钥过期时间
        type: string
      key_id:
        description: 密钥ID
        type: string
      public_key:
        description: 公钥内容
        type: string
      rotate_cycle:
        description: 密钥轮换周期
        type: string
    type: object
  service.AttachmentResponse:
    properties:
      created_at:
        type: string
      extension:
        type: string
      group_id:
        type: integer
      id:
        type: integer
      mime_type:
        type: string
      name:
        type: string
      original_name:
        type: string
      path:
        type: string
      size:
        type: integer
      updated_at:
        type: string
      uploaded_by:
        type: string
    type: object
  service.BatchDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  service.ConfigGroup:
    properties:
      label:
        type: string
      value:
        type: string
    type: object
  service.ConfigResponse:
    properties:
      created_at:
        type: string
      group:
        type: string
      id:
        type: integer
      key:
        type: string
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
      type:
        type: string
      updated_at:
        type: string
      value:
        type: string
    type: object
  service.CreateConfigRequest:
    properties:
      group:
        maxLength: 50
        type: string
      key:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        type: string
      remark:
        maxLength: 500
        type: string
      status:
        type: integer
      type:
        enum:
        - string
        - number
        - boolean
        - json
        type: string
      value:
        maxLength: 2048
        type: string
    required:
    - key
    - name
    type: object
  service.CreateCronJobRequest:
    properties:
      command:
        type: string
      description:
        maxLength: 500
        type: string
      enabled:
        type: boolean
      expression:
        type: string
      name:
        maxLength: 100
        type: string
      type:
        enum:
        - shell
        - curl
        - task
        type: string
    required:
    - command
    - expression
    - name
    - type
    type: object
  service.CreateDictDataRequest:
    properties:
      css_class:
        maxLength: 100
        type: string
      dict_type:
        maxLength: 100
        type: string
      is_default:
        type: boolean
      label:
        maxLength: 100
        type: string
      remark:
        maxLength: 500
        type: string
      sort:
        type: integer
      status:
        type: integer
      value:
        maxLength: 100
        type: string
    required:
    - dict_type
    - label
    - value
    type: object
  service.CreateGroupRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 255
        type: string
      sort:
        type: integer
    required:
    - name
    type: object
  service.CreatePermissionRequest:
    properties:
      action:
        type: string
      description:
        type: string
      domain:
        type: string
      object:
        type: string
      role_name:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/service.PermissionType'
        enum:
        - api
        - menu
        - button
    required:
    - action
    - domain
    - object
    - role_name
    - type
    type: object
  service.CreateRoleRequest:
    properties:
      created_by:
        type: string
      description:
        maxLength: 500
        type: string
      display_name:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - display_name
    - name
    type: object
  service.CronJobResponse:
    properties:
      command:
        type: string
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      expression:
        type: string
      id:
        type: integer
      last_run_at:
        type: string
      name:
        type: string
      next_run_at:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  service.DictDataResponse:
    properties:
      created_at:
        type: string
      css_class:
        type: string
      dict_type:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      label:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
      value:
        type: string
    type: object
  service.GroupResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      sort:
        type: integer
      updated_at:
        type: string
    type: object
  service.ListAttachmentsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/service.AttachmentResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  service.ListConfigResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/service.ConfigResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  service.ListCronJobsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/service.CronJobResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  service.ListDictDataResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/service.DictDataResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  service.ListGroupsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/service.GroupResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  service.ListOperationLogsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/service.OperationLogResponse'
        type: array
      total:
        type: integer
    type: object
  service.ListPermissionsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/service.PermissionResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  service.ListRolesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/service.RoleResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  service.LoginRequest:
    properties:
      email:
        type: string
      encrypted_email:
        description: 加密的邮箱（用于等保要求）
        type: string
      encrypted_password:
        description: 加密的密码（用于等保要求）
        type: string
      key_id:
        description: 加密密钥ID
        type: string
      nonce:
        description: 随机数（防止重放攻击）
        type: string
      password:
        type: string
      timestamp:
        description: 请求时间戳（防止重放攻击）
        type: integer
    type: object
  service.MoveAttachmentRequest:
    properties:
      group_id:
        type: integer
    type: object
  service.OperationLogResponse:
    properties:
      action:
        type: string
      created_at:
        type: string
      description:
        type: string
      duration_ms:
        type: integer
      id:
        type: integer
      ip:
        type: string
      method:
        type: string
      module:
        type: string
      path:
        type: string
      request_body:
        type: string
      status_code:
        type: integer
      user_agent:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  service.PermissionResponse:
    properties:
      action:
        type: string
      description:
        type: string
      domain:
        type: string
      id:
        type: integer
      object:
        type: string
      role_name:
        type: string
      type:
        $ref: '#/definitions/service.PermissionType'
    type: object
  service.PermissionRule:
    properties:
      action:
        description: HTTP方法、menu或button
        type: string
      object:
        description: API路径、菜单路径或按钮标识
        type: string
    required:
    - action
    - object
    type: object
  service.PermissionType:
    enum:
    - api
    - menu
    - button
    type: string
    x-enum-varnames:
    - PermissionTypeAPI
    - PermissionTypeMenu
    - PermissionTypeButton
  service.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  service.RoleResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      display_name:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  service.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  service.UpdateConfigRequest:
    properties:
      group:
        maxLength: 50
        type: string
      key:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        type: string
      remark:
        maxLength: 500
        type: string
      status:
        type: integer
      type:
        enum:
        - string
        - number
        - boolean
        - json
        type: string
      value:
        maxLength: 2048
        type: string
    type: object
  service.UpdateCronJobRequest:
    properties:
      command:
        type: string
      description:
        maxLength: 500
        type: string
      expression:
        type: string
      name:
        maxLength: 100
        type: string
      type:
        enum:
        - shell
        - curl
        - task
        type: string
    type: object
  service.UpdateDictDataRequest:
    properties:
      css_class:
        maxLength: 100
        type: string
      dict_type:
        maxLength: 100
        type: string
      is_default:
        type: boolean
      label:
        maxLength: 100
        type: string
      remark:
        maxLength: 500
        type: string
      sort:
        type: integer
      status:
        type: integer
      value:
        maxLength: 100
        type: string
    type: object
  service.UpdateGroupRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 255
        type: string
      sort:
        type: integer
    type: object
  service.UpdatePermissionRequest:
    properties:
      action:
        type: string
      description:
        type: string
      domain:
        type: string
      new_action:
        type: string
      new_object:
        type: string
      object:
        type: string
      role_name:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/service.PermissionType'
        enum:
        - api
        - menu
        - button
    required:
    - action
    - domain
    - object
    - role_name
    - type
    type: object
  service.UpdateRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      display_name:
        maxLength: 255
        type: string
      updated_by:
        type: string
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:9501
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: 管理系统的API文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: 管理系统 API
  version: "1.0"
paths:
  /api/v1/admin/auth/attachment-groups:
    get:
      description: 获取附件分组列表，支持分页和关键字搜索
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10
        in: query
        name: page_size
        type: integer
      - description: 关键字
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ListGroupsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 获取附件分组列表
      tags:
      - 附件分组管理
    post:
      consumes:
      - application/json
      description: 创建新的附件分组
      parameters:
      - description: 分组信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.GroupResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 创建附件分组
      tags:
      - 附件分组管理
  /api/v1/admin/auth/attachment-groups/{id}:
    delete:
      description: 根据ID删除附件分组，分组下有附件时拒绝删除
      parameters:
      - description: 分组ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 删除附件分组
      tags:
      - 附件分组管理
    get:
      description: 根据ID获取附件分组详细信息
      parameters:
      - description: 分组ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.GroupResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 获取附件分组详情
      tags:
      - 附件分组管理
    put:
      consumes:
      - application/json
      description: 根据ID更新附件分组信息
      parameters:
      - description: 分组ID
        in: path
        name: id
        required: true
        type: integer
      - description: 分组信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.UpdateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 更新附件分组
      tags:
      - 附件分组管理
  /api/v1/admin/auth/attachments:
    get:
      description: 获取附件列表，支持分页、关键字搜索、分组筛选和MIME类型筛选
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10
        in: query
        name: page_size
        type: integer
      - description: 按名称搜索
        in: query
        name: keyword
        type: string
      - description: 分组ID筛选
        in: query
        name: group_id
        type: integer
      - description: MIME类型筛选
        in: query
        name: mime_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ListAttachmentsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 获取附件列表
      tags:
      - 附件管理
  /api/v1/admin/auth/attachments/{id}:
    delete:
      description: 根据ID删除附件
      parameters:
      - description: 附件ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 删除附件
      tags:
      - 附件管理
    get:
      description: 根据ID获取附件详细信息
      parameters:
      - description: 附件ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AttachmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 获取附件详情
      tags:
      - 附件管理
  /api/v1/admin/auth/attachments/{id}/move:
    put:
      consumes:
      - application/json
      description: 将附件移动到指定分组，group_id为null时移出分组
      parameters:
      - description: 附件ID
        in: path
        name: id
        required: true
        type: integer
      - description: 目标分组信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.MoveAttachmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 移动附件到分组
